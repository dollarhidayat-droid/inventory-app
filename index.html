<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxeBW3JTiDBqi6xTtxGxdrXSlZGkMxW908jWb_recGlF0aXmjoRITAs8xdX4as_-Cr8yg/exec";

// ================= MASTER DATA API FUNCTIONS =================

// Auto-fill master data
function isiMasterOtomatis(){
  fetch(API_URL)
    .then(res => res.json())
    .then(master => {
      const m = master.find(x => x.barcode === mBarcode.value.trim());
      if(m){
        mNama.value = m.nama || "";
        mSatuan.value = m.satuan || "";
        mMinimal.value = m.minimal || 0;
        mKategori.value = m.kategori || "";
        mLine.value = m.line || "";
        mPic.value = m.pic || "";
      } else {
        mNama.value = "";
        mSatuan.value = "";
        mMinimal.value = "";
        mKategori.value = "";
        mLine.value = "";
        mPic.value = "";
      }
    })
    .catch(err => console.error("Gagal fetch master:", err));
}

// Tambah master
function tambahMaster(){
  const data = {
    mode: "addMaster",
    barcode: mBarcode.value.trim(),
    nama: mNama.value.trim(),
    satuan: mSatuan.value.trim(),
    minimal: Number(mMinimal.value) || 0,
    kategori: mKategori.value.trim(),
    line: mLine.value.trim(),
    pic: mPic.value.trim()
  };

  if(!data.barcode || !data.nama) return alert("Barcode dan Nama wajib diisi!");

  fetch(API_URL, {
    method: "POST",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify(data)
  })
  .then(res => res.json())
  .then(() => {
    showDoneMessage("✅ Master berhasil ditambahkan");
    tampilMaster();
    mBarcode.value = mNama.value = mSatuan.value = mMinimal.value = mKategori.value = mLine.value = mPic.value = "";
  })
  .catch(err => alert("Gagal menambahkan master: " + err));
}

// Tampil master
function tampilMaster(){
  fetch(API_URL)
    .then(res => res.json())
    .then(master => {
      const masterBody = document.getElementById("masterBody");
      masterBody.innerHTML = "";
      master.forEach(m => {
        masterBody.innerHTML += `<tr>
          <td>${m.barcode}</td>
          <td>${m.nama}</td>
          <td>${m.satuan}</td>
          <td>${m.minimal}</td>
          <td>${m.kategori}</td>
          <td>${m.line}</td>
          <td class="admin-only">
            <button onclick="hapusMaster('${m.barcode}')">Hapus</button>
          </td>
        </tr>`;
      });
      applyRole();
      updateKategoriFilter();
    })
    .catch(err => console.error("Gagal tampil master:", err));
}

// Hapus master (dummy)
function hapusMaster(barcode){
  alert("Fungsi hapus belum terhubung API. Bisa ditambahkan di Apps Script jika perlu.");
}

// Upload Excel master
function uploadMasterExcel(){
  const f = uploadExcel.files[0];
  if(!f) return alert("Pilih file Excel terlebih dahulu!");
  const reader = new FileReader();
  reader.onload = e => {
    const wb = XLSX.read(e.target.result, { type: "array" });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);

    rows.forEach(r => {
      const data = {
        mode: "addMaster",
        barcode: r.Barcode,
        nama: r.Nama,
        satuan: r.Satuan,
        minimal: Number(r.Minimal) || 0,
        kategori: r.Kategori,
        line: r.Line,
        pic: r.PIC
      };
      fetch(API_URL, {
        method: "POST",
        headers: {"Content-Type":"application/json"},
        body: JSON.stringify(data)
      }).catch(err => console.error("Gagal upload row:", err));
    });

    showDoneMessage("✅ Upload Excel master berhasil");
    uploadExcel.value = "";
    tampilMaster();
  };
  reader.readAsArrayBuffer(f);
}
</script>

<script>
// ambil elemen DOM
const loginUser = document.getElementById("loginUser");
const loginPass = document.getElementById("loginPass");
const loginOverlay = document.getElementById("loginOverlay");
const appRoot = document.getElementById("appRoot");
const logoutBtn = document.getElementById("logoutBtn");

// USERS
const USERS={admin:{pass:"admin123",role:"admin"},user:{pass:"user123",role:"user"}}
let currentRole=null

/* ================= LOGIN ================= */
function doLogin(){
  const u = loginUser.value.trim();
  const p = loginPass.value.trim();
  if(USERS[u] && USERS[u].pass === p){
    currentRole = USERS[u].role;
    loginOverlay.style.display = "none";
    appRoot.style.display = "block";
    logoutBtn.style.display = "block";
    applyRole();
    loadAll();
  } else {
    alert("Login gagal: username atau password salah");
  }
}

function fillDemo(){loginUser.value="user"; loginPass.value="user123";}
function doLogout(){
  // reset role
  currentRole = null;

  // sembunyikan app root & logout button
  appRoot.style.display = "none";
  logoutBtn.style.display = "none";

  // tampilkan login overlay
  loginOverlay.style.display = "flex";

  // reset input login
  loginUser.value = "";
  loginPass.value = "";

  // sembunyikan semua elemen admin-only
  document.querySelectorAll(".admin-only").forEach(el => el.style.display = "none");
}


/* ================= ROLE ================= */
function applyRole(){
  // Tampilkan elemen admin-only hanya jika role admin
  document.querySelectorAll(".admin-only").forEach(el => {
    if(currentRole === "admin"){
      el.style.display = ""; // tampilkan untuk admin
    } else {
      el.style.display = "none"; // sembunyikan untuk user
    }
  });
}

/* ================= DONE MESSAGE ================= */
function showDoneMessage(msg){
  const div=document.getElementById("doneMsg");
  div.innerText=msg;
  div.style.color="green";
  setTimeout(()=>{div.innerText=""},3000);
}

/* ================= MASTER ================= */
function tambahMaster(){
  let data = JSON.parse(localStorage.masterData || "[]");
  data.push({
    barcode: mBarcode.value.trim(),
    nama: mNama.value.trim(),
    satuan: mSatuan.value.trim(),
    minimal: Number(mMinimal.value) || 0,
    kategori: mKategori.value.trim(),
    line: mLine.value.trim(),
    pic: mPic.value.trim()
  });
  localStorage.masterData = JSON.stringify(data);
  tampilMaster();
  showDoneMessage("✅ Master berhasil ditambahkan");
}

function uploadMasterExcel(){
  const f = uploadExcel.files[0];
  if(!f) return;

  const r = new FileReader();
  r.onload = e => {
    const wb = XLSX.read(e.target.result, { type: "array" });
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]);

    let masterData = [];

    rows.forEach(r => {
      masterData.push({
        barcode: r.Barcode,
        nama: r.Nama,
        satuan: r.Satuan,
        minimal: Number(r.Minimal) || 0,
        kategori: r.Kategori,
        line: r.Line,
        pic: r.PIC
      });
    });

    localStorage.masterData = JSON.stringify(masterData);
    localStorage.transaksi = "[]";

    tampilMaster();
    renderStock();
    renderReport();

    uploadExcel.value = "";
    showDoneMessage("✅ Upload master sukses dan data lama direset");
  };
  r.readAsArrayBuffer(f);
}

function tampilMaster(){
  const d = JSON.parse(localStorage.masterData || "[]");
  masterBody.innerHTML = "";
  d.forEach(m => {
    masterBody.innerHTML += `<tr>
      <td>${m.barcode}</td>
      <td>${m.nama}</td>
      <td>${m.satuan}</td>
      <td>${m.minimal}</td>
      <td>${m.kategori}</td>
      <td>${m.line}</td>
      <td class="admin-only">
        <button onclick="hapusMaster('${m.barcode}')">Hapus</button>
      </td>
    </tr>`;
  });
  applyRole();
  updateKategoriFilter(); // ✅ refresh filter kategori otomatis
}

function hapusMaster(b){
  let d = JSON.parse(localStorage.masterData || "[]");
  localStorage.masterData = JSON.stringify(d.filter(x => x.barcode !== b));
  tampilMaster();
  showDoneMessage("✅ Master berhasil dihapus");
}

/* ================= UPDATE FILTER KATEGORI ================= */
function updateKategoriFilter(){
  const master = JSON.parse(localStorage.masterData || "[]");
  const select = document.getElementById("filterKategori");
  if(!select) return;

  const current = select.value;
  select.innerHTML = `<option value="">-- Semua Kategori --</option>`;

  const kategoriUnik = [...new Set(
    master.map(m => m.kategori).filter(k => k && k.trim() !== "")
  )];

  kategoriUnik.forEach(k => {
    const opt = document.createElement("option");
    opt.value = k.toLowerCase();
    opt.textContent = k;
    select.appendChild(opt);
  });

  select.value = current;
}

/* ================= TRANSAKSI ================= */

function isiOtomatis(){
  const master = JSON.parse(localStorage.masterData || "[]");
  const m = master.find(x => x.barcode === kodeBarang.value.trim());

  if(m){
    namaBarang.value = m.nama || "";
    satuan.value = m.satuan || "";
    kategoriBarang.value = m.kategori || "";

    // LINE TIDAK OTOMATIS
    lineDept.value = "";
  }
}
function simpanTransaksi(){
  const master = JSON.parse(localStorage.masterData || "[]");
  const m = master.find(x => x.barcode === kodeBarang.value.trim());

  if(!m){
    alert("Barang tidak ada di master!");
    return;
  }

  if(!qty.value || qty.value <= 0){
    alert("Qty harus lebih dari 0");
    return;
  }

  let transaksi = JSON.parse(localStorage.transaksi || "[]");

  const tgl = new Date().toISOString(); // tanggal + jam

transaksi.unshift({
  kode: kodeBarang.value.trim(),
  nama: m.nama,
  satuan: m.satuan || "",
  kategori: m.kategori || "",
  line: lineDept.value.trim() || "-",
  pic: picAmbil.value.trim() || m.pic || "",
  qty: Number(qty.value),
  jenis: jenis.value,
  tanggal: tgl
});
  localStorage.transaksi = JSON.stringify(transaksi);

  renderStock();
  renderReport();

  /* ================= RESET FORM ================= */
  kodeBarang.value = "";
  namaBarang.value = "";
  satuan.value = "";
  kategoriBarang.value = "";
  lineDept.value = "";
  picAmbil.value = "";
  qty.value = 1;
  jenis.value = "Masuk";

  /* ================= PESAN SUKSES ================= */
  showDoneMessage("✅ Transaksi berhasil disimpan");

  kodeBarang.focus();
}

/* ================= UPLOAD EXCEL TRANSAKSI ================= */
function uploadTransaksiExcel(){

  const f = uploadTransaksi.files[0];
  if(!f) return;

  const r = new FileReader();

  r.onload = e => {

    const wb =
    XLSX.read(
      e.target.result,
      { type: "array" }
    );

    const rows =
    XLSX.utils.sheet_to_json(
      wb.Sheets[
        wb.SheetNames[0]
      ]
    );

    const master =
    JSON.parse(
      localStorage.masterData || "[]"
    );

    let transaksi = [];

    rows.forEach(r => {

      const m =
      master.find(
        x =>
        x.barcode ==
        r.Barcode
      );

      if(m){

        transaksi.push({

          kode:
          m.barcode,

          nama:
          m.nama,

          satuan:
          m.satuan || "",

          kategori:
          m.kategori || "",

          line:
          m.line || "",

          pic:
          r.PIC ||
          m.pic ||
          "",

          qty:
          Number(
            r.Qty
          ) || 0,

          jenis:
          r.Jenis || "Masuk",

          tanggal:
          r.Tanggal
          ? new Date(
              r.Tanggal
            ).toISOString()
          : new Date()
            .toISOString()

        });

      }
    });

    localStorage.transaksi =
    JSON.stringify(
      transaksi
    );

    renderStock();
    renderReport();

    showDoneMessage(
      "✅ Upload transaksi sukses & stok dihitung ulang"
    );

    uploadTransaksi.value =
    "";

  };

  r.readAsArrayBuffer(f);
}
/* ================= STOCK ================= */
  /* ================= UPLOAD STOCK OPNAME ================= */
function uploadStockExcel(){

  const f =
  document.getElementById(
    "uploadStock"
  ).files[0];

  if(!f){
    alert("Pilih file stock opname");
    return;
  }

  const reader =
  new FileReader();

  reader.onload = e => {

    const wb =
    XLSX.read(
      e.target.result,
      { type:"array" }
    );

    const rows =
    XLSX.utils.sheet_to_json(
      wb.Sheets[
        wb.SheetNames[0]
      ]
    );

    let stockAwal = {};

    rows.forEach(r => {

  const kode =
  String(
    r.Barcode ||
    r.Kode ||
    ""
  ).trim();

  if(!kode) return;

  stockAwal[kode] =
  Number(
    r.Sisa_Stok ||
    r.Sisa ||
    0
  );

});
    // GANTI stok lama
    localStorage.stockAwal =
    JSON.stringify(
      stockAwal
    );

    // RESET transaksi lama
    localStorage.transaksi =
    JSON.stringify([]);

    renderStock();
    renderReport();

    showDoneMessage(
      "✅ Stock opname berhasil diperbarui"
    );

    document.getElementById(
      "uploadStock"
    ).value = "";

  };

  // WAJIB DI LUAR reader.onload
  reader.readAsArrayBuffer(f);
}
function renderStock() {
  const master = JSON.parse(localStorage.masterData || "[]");
  const trx = JSON.parse(localStorage.transaksi || "[]");

  const filterKategori =
    document.getElementById("filterKategori")
    .value.toLowerCase();

  const search =
    document.getElementById("searchStock")
    .value.toLowerCase();

  // Ambil saldo awal stock opname
const stockAwal =
JSON.parse(
  localStorage.stockAwal || "{}"
);

// Hitung stok
let stockMap = {};

// mulai dari saldo opname
master.forEach(m => {

  stockMap[m.barcode] =
  Number(
    stockAwal[
      m.barcode
    ]
  ) || 0;

});

// tambah / kurang transaksi
trx.forEach(t => {

  stockMap[t.kode] =
  stockMap[t.kode] || 0;

  stockMap[t.kode] +=
    t.jenis === "Masuk"
    ? Number(t.qty)
    : -Number(t.qty);

});
  // Gabungkan master + stok
  let stockData =
  master.map(m => {

    const sisa =
      stockMap[m.barcode] || 0;

    return {
      ...m,
      sisa
    };
  });

  // Filter kategori + search
  stockData =
  stockData.filter(m => {

    if (
      filterKategori &&
      m.kategori.toLowerCase()
      !== filterKategori
    ) return false;

    if (
      search &&
      !(
        m.nama.toLowerCase()
        .includes(search)
        ||
        m.barcode.toLowerCase()
        .includes(search)
      )
    ) return false;

    return true;
  });

  // PARETO: stok terkecil di atas
  stockData.sort(
    (a, b) => a.sisa - b.sisa
  );

  stockBody.innerHTML = "";

  stockData.forEach(m => {

    let statusClass =
      "status-aman";

    let statusText =
      "Aman";

    if (m.sisa <= 0) {
      statusClass =
        "status-habis";
      statusText =
        "Habis";
    }
    else if (
      m.sisa <= m.minimal
    ) {
      statusClass =
        "status-warning";
      statusText =
        "Warning";
    }

    stockBody.innerHTML += `
      <tr>
        <td>${m.barcode}</td>
        <td>${m.nama}</td>
        <td>${m.sisa}</td>
        <td>${m.minimal}</td>
        <td class="${statusClass}">
          ${statusText}
        </td>
      </tr>
    `;
  });
}
/* ================= REPORT ================= */
function renderReport(){

  const trx =
  JSON.parse(localStorage.transaksi || "[]");

  const tglFilter =
  document.getElementById(
    "reportTanggal"
  ).value;

  const jenisFilter =
  document.getElementById(
    "reportJenis"
  ).value;

  const search =
  document.getElementById(
    "searchReport"
  ).value.toLowerCase();

  const sorted =
  trx.sort((a,b)=>
    new Date(b.tanggal)
    - new Date(a.tanggal)
  );

  reportBody.innerHTML = "";

  sorted.forEach(t=>{

    if(
      tglFilter &&
      !t.tanggal.startsWith(
        tglFilter
      )
    ) return;

    if(
      jenisFilter &&
      t.jenis !== jenisFilter
    ) return;

    if(
      search &&
      !(
        t.kode.toLowerCase()
        .includes(search)
        ||
        t.nama.toLowerCase()
        .includes(search)
      )
    ) return;

    reportBody.innerHTML += `
    <tr>
      <td>${formatTanggalJam(t.tanggal)}</td>
      <td>${t.kode}</td>
      <td>${t.nama}</td>
      <td>${t.kategori || "-"}</td>
      <td>${t.line || "-"}</td>
      <td>${t.pic || "-"}</td>
      <td>${t.qty}</td>
      <td>${t.satuan || "-"}</td>
      <td>${t.jenis}</td>

<td>
  <span style="
    padding:4px 8px;
    border-radius:6px;
    font-size:12px;
    font-weight:bold;
    background:
    ${t.jenis === 'Keluar'
      ? '#dcfce7'
      : '#dbeafe'};
    color:
    ${t.jenis === 'Keluar'
      ? '#166534'
      : '#1e40af'};
  ">
    ${
      t.jenis === 'Keluar'
      ? 'Delivered'
      : 'Received'
    }
  </span>
</td>
    </tr>`;
  });
}

/* ================= SCANNER ================= */
let scanner;
function startScanner(){
  const scannerArea=document.getElementById("scannerArea");
  scannerArea.style.display="block";
  if(scanner) return;
  scanner=new Instascan.Scanner({video:document.getElementById('preview')});
  scanner.addListener('scan', function(content){
    kodeBarang.value=content;
    isiOtomatis();
    scanner.stop();
    scannerArea.style.display="none";
  });
  Instascan.Camera.getCameras().then(function(cameras){
    if(cameras.length>0) scanner.start(cameras[0]);
    else alert('Tidak ada kamera ditemukan');
  }).catch(function(e){
    console.error(e);
    alert('Gagal mengakses kamera: '+e);
  });
}
/* ================= AUTO DELETE HISTORY > 2 BULAN ================= */
function cleanupOldTransactions(){
  let trx = JSON.parse(localStorage.transaksi || "[]");

  // tanggal hari ini
  const today = new Date();

  // batas 2 bulan ke belakang
  const limitDate = new Date();
  limitDate.setMonth(today.getMonth() - 2);

  // filter transaksi yang masih <= 2 bulan
  trx = trx.filter(t => {
    const trxDate = new Date(t.tanggal);
    return trxDate >= limitDate;
  });

  // simpan ulang ke localStorage
  localStorage.transaksi = JSON.stringify(trx);

  console.log("History transaksi >2 bulan sudah dibersihkan");
}

function loadAll(){
  cleanupOldTransactions(); // auto hapus history > 2 bulan
  tampilMaster();

}

/* ================= FORMAT TANGGAL + JAM ================= */
function formatTanggalJam(iso){
  const d = new Date(iso);
  return d.toLocaleString("id-ID", {
    day: "2-digit",
    month: "long",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit"
  });
}
